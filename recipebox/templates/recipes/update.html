{% extends 'base.html' %}

{% block title %}Edit "{{ recipe['title'] }}"{% endblock %}
{% block header %}Edit "{{ recipe['title'] }}"{% endblock %}

{% block content %}
<form method="post" class="col-md-7">
  <div class="mb-3">
    <label for="title" class="form-label">Title</label>
    <input class="form-control" name="title" id="title"
           value="{{ request.form['title'] or recipe['title'] }}" required>
  </div>
  <div class="mb-3">
    <label for="ingredients" class="form-label">Ingredients (one per line)</label>
    <textarea class="form-control" name="ingredients" id="ingredients" rows="6">{{ request.form['ingredients'] or ingredients | map(attribute='description') | join('\n') }}</textarea>
  </div>
  <div class="mb-3">
    <label for="instructions" class="form-label">Instructions</label>
    <textarea class="form-control" name="instructions" id="instructions" rows="8">{{ request.form['instructions'] or recipe['instructions'] }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save Changes</button>
  <a href="{{ url_for('recipes.detail', id=recipe['id']) }}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
