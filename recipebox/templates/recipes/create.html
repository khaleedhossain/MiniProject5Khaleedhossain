{% extends 'base.html' %}

{% block title %}New Recipe{% endblock %}
{% block header %}New Recipe{% endblock %}

{% block content %}
<form method="post" class="col-md-7">
  <div class="mb-3">
    <label for="title" class="form-label">Title</label>
    <input class="form-control" name="title" id="title" value="{{ request.form['title'] }}" required>
  </div>
  <div class="mb-3">
    <label for="ingredients" class="form-label">Ingredients (one per line)</label>
    <textarea class="form-control" name="ingredients" id="ingredients" rows="6"
              placeholder="2 cups flour&#10;1 tsp salt&#10;3 eggs">{{ request.form['ingredients'] }}</textarea>
  </div>
  <div class="mb-3">
    <label for="instructions" class="form-label">Instructions</label>
    <textarea class="form-control" name="instructions" id="instructions" rows="8">{{ request.form['instructions'] }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save Recipe</button>
</form>
{% endblock %}
